<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#071326" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Security Shield Badge -->
  <path d="M32 4 L56 14 V28 C56 44 46 55 32 60 C18 55 8 44 8 28 V14 L32 4 Z" fill="#071326" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Radar / Artificial Intelligence Eye -->
  <circle cx="32" cy="32" r="14" fill="url(#radarGrad)" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#071326"/>

  <!-- Radar Sweep & Target Crosshairs -->
  <line x1="15" y1="32" x2="49" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="15" x2="32" y2="49" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M32 32 L44 20 A16 16 0 0 0 32 16 Z" fill="#00f0ff" fill-opacity="0.4"/>
</svg>